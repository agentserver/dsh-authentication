name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm --filter @agentserver/dsh-authentication publish --access public --provenance
      - run: pnpm --filter @agentserver/dsh-authentication-token publish --access public --provenance
      - run: pnpm --filter @agentserver/dsh-authentication-oidc publish --access public --provenance
